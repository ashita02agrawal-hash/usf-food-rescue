<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Platewise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b7a55">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Platewise">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="var(--accent)"/><circle cx="13" cy="13" r="7" fill="none" stroke="var(--accent-ink)" stroke-width="2"/><path d="M13 9v4l3 2" stroke="var(--accent-ink)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    Platewise
  </div>
  <span class="tag">Sample data</span>
  <div class="spacer"></div>
  <div class="seg" id="viewSeg" role="group" aria-label="View" hidden>
    <button data-view="both" aria-pressed="false">Both</button>
    <button data-view="club" aria-pressed="false">Club</button>
    <button data-view="student" aria-pressed="false">Student</button>
  </div>
</header>

<main class="wrap">
  <section id="login" class="login" hidden></section>
  <div id="stage" class="stage" hidden>
    <section class="pane" id="clubPane"></section>
    <section class="pane" id="studentPane"></section>
  </div>
  <div class="foot" id="foot" hidden>
    <span>·</span>
    <div id="syncBox"></div>
    <details class="demo"><summary>Demo tools</summary>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" data-action="ff">Skip ahead 5 min</button>
        <button class="btn sm" data-action="bot">Another student claims</button>
        <button class="btn sm" data-action="reset">Reset demo</button>
        <button class="btn sm" data-action="logout">Log out</button>
      </div>
    </details>
  </div>
</main>
<div id="toasts" aria-live="polite"></div>
<div id="sheetRoot"></div>


<!-- Load order matters: core first, app last. -->
<script src="js/core.js"></script>
<script src="js/model.js"></script>
<script src="js/club.js"></script>
<script src="js/student.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
